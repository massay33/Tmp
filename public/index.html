<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Крестики-Нолики</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #0a0a0a;
            overflow: hidden;
        }

        .game-container {
            text-align: center;
            color: white;
            padding: 40px;
            background: rgba(20, 20, 30, 0.8);
            border-radius: 20px;
            box-shadow: 
                0 0 30px rgba(0, 255, 255, 0.3),
                0 0 60px rgba(255, 0, 255, 0.2);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 255, 255, 0.1);
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 4px;
            color: #fff;
            text-shadow: 
                0 0 10px #0ff,
                0 0 20px #0ff,
                0 0 40px #0ff,
                0 0 80px #0ff;
            animation: glow 1.5s ease-in-out infinite alternate;
        }

        @keyframes glow {
            from {
                text-shadow: 
                    0 0 10px #0ff,
                    0 0 20px #0ff,
                    0 0 40px #0ff,
                    0 0 80px #0ff;
            }
            to {
                text-shadow: 
                    0 0 20px #f0f,
                    0 0 30px #f0f,
                    0 0 50px #f0f,
                    0 0 100px #f0f;
            }
        }

        .status {
            font-size: 1.5rem;
            margin-bottom: 30px;
            min-height: 40px;
            color: #e0e0e0;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
        }

        .board {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 30px;
        }

        .cell {
            width: 100px;
            height: 100px;
            background: rgba(30, 30, 50, 0.6);
            border: 3px solid rgba(255, 255, 255, 0.2);
            border-radius: 25px;
            font-size: 3.5rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.68, -0.55, 0.27, 1.55);
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        .cell:hover:not(.x):not(.o) {
            border-color: #fff;
            background: rgba(50, 50, 80, 0.8);
            animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both;
            transform: scale(1.05);
            box-shadow: 
                0 0 20px rgba(255, 255, 255, 0.4),
                inset 0 0 10px rgba(255, 255, 255, 0.2);
        }

        @keyframes shake {
            10%, 90% {
                transform: translate3d(-2px, 0, 0) scale(1.05);
            }
            20%, 80% {
                transform: translate3d(3px, 0, 0) scale(1.05);
            }
            30%, 50%, 70% {
                transform: translate3d(-5px, 0, 0) scale(1.05);
            }
            40%, 60% {
                transform: translate3d(5px, 0, 0) scale(1.05);
            }
        }

        .cell.x {
            border-color: #0ff;
            color: #0ff;
            text-shadow: 
                0 0 10px #0ff,
                0 0 20px #0ff,
                0 0 40px #0ff;
            box-shadow: 
                inset 0 0 20px rgba(0, 255, 255, 0.3),
                0 0 15px rgba(0, 255, 255, 0.5);
        }

        .cell.o {
            border-color: #f0f;
            color: #f0f;
            text-shadow: 
                0 0 10px #f0f,
                0 0 20px #f0f,
                0 0 40px #f0f;
            box-shadow: 
                inset 0 0 20px rgba(255, 0, 255, 0.3),
                0 0 15px rgba(255, 0, 255, 0.5);
        }

        .cell.winner {
            animation: winnerPulse 1s ease-in-out infinite;
            background: rgba(255, 255, 255, 0.2);
        }

        @keyframes winnerPulse {
            0%, 100% {
                transform: scale(1);
                box-shadow: 
                    0 0 20px currentColor,
                    0 0 40px currentColor,
                    0 0 60px currentColor;
            }
            50% {
                transform: scale(1.1);
                box-shadow: 
                    0 0 30px currentColor,
                    0 0 60px currentColor,
                    0 0 90px currentColor;
            }
        }

        .restart-btn {
            padding: 15px 40px;
            font-size: 1.2rem;
            background: transparent;
            color: #fff;
            border: 3px solid #0ff;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            font-weight: bold;
            letter-spacing: 2px;
            box-shadow: 
                0 0 10px #0ff,
                inset 0 0 10px rgba(0, 255, 255, 0.3);
        }

        .restart-btn:hover {
            background: #0ff;
            color: #000;
            box-shadow: 
                0 0 20px #0ff,
                0 0 40px #0ff,
                0 0 60px #0ff,
                inset 0 0 20px rgba(0, 255, 255, 0.5);
            transform: translateY(-3px);
        }

        .restart-btn:active {
            transform: translateY(0);
        }

        @media (max-width: 400px) {
            .cell {
                width: 80px;
                height: 80px;
                font-size: 2.5rem;
                border-radius: 20px;
            }

            h1 {
                font-size: 2rem;
            }
            
            .game-container {
                padding: 30px;
            }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <h1>Крестики-Нолики</h1>
        <div class="status" id="status">Ход игрока: X</div>
        <div class="board" id="board">
            <div class="cell" data-index="0"></div>
            <div class="cell" data-index="1"></div>
            <div class="cell" data-index="2"></div>
            <div class="cell" data-index="3"></div>
            <div class="cell" data-index="4"></div>
            <div class="cell" data-index="5"></div>
            <div class="cell" data-index="6"></div>
            <div class="cell" data-index="7"></div>
            <div class="cell" data-index="8"></div>
        </div>
        <button class="restart-btn" id="restartBtn">Начать заново</button>
    </div>

    <script>
        const cells = document.querySelectorAll('.cell');
        const status = document.getElementById('status');
        const restartBtn = document.getElementById('restartBtn');
        
        let currentPlayer = 'X';
        let board = ['', '', '', '', '', '', '', '', ''];
        let gameActive = true;

        const winningCombinations = [
            [0, 1, 2],
            [3, 4, 5],
            [6, 7, 8],
            [0, 3, 6],
            [1, 4, 7],
            [2, 5, 8],
            [0, 4, 8],
            [2, 4, 6]
        ];

        function handleCellClick(e) {
            const cell = e.target;
            const index = cell.getAttribute('data-index');

            if (board[index] !== '' || !gameActive) {
                return;
            }

            board[index] = currentPlayer;
            cell.textContent = currentPlayer;
            cell.classList.add(currentPlayer.toLowerCase());

            if (checkWin()) {
                status.textContent = `Победил игрок ${currentPlayer}!`;
                gameActive = false;
                return;
            }

            if (checkDraw()) {
                status.textContent = 'Ничья!';
                gameActive = false;
                return;
            }

            currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
            status.textContent = `Ход игрока: ${currentPlayer}`;
        }

        function checkWin() {
            return winningCombinations.some(combination => {
                return combination.every(index => {
                    return board[index] === currentPlayer;
                });
            });
        }

        function checkDraw() {
            return board.every(cell => cell !== '');
        }

        function restartGame() {
            currentPlayer = 'X';
            board = ['', '', '', '', '', '', '', '', ''];
            gameActive = true;
            status.textContent = `Ход игрока: ${currentPlayer}`;
            
            cells.forEach(cell => {
                cell.textContent = '';
                cell.classList.remove('x', 'o');
            });
        }

        cells.forEach(cell => {
            cell.addEventListener('click', handleCellClick);
        });

        restartBtn.addEventListener('click', restartGame);
    </script>
</body>
</html>
